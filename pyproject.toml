[project]
name = "metron"
version = "0.1.0"
description = "cli for simple statistics"
readme = "README.md"
authors = [{ name = "Kele98-star" }]
requires-python = ">=3.15"
dependencies = ["typer>=0.27.3"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.1", "ty>=0.0.89"]

[project.scripts]
metron = "metron.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [".venv", "data"]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001", "D203", "D213", "COM812", "TD002", "TD003", "FIX002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.rules]
all = "error"
